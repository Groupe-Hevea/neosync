<text x="40" y="38" font-family="Arial, sans-serif" font-size="14" fill="black">PII Detection</text>
<text x="35" y="170" font-family="Arial, sans-serif" font-size="12" fill="black">Scanning for sensitive data...</text>
<text x="35" y="185" font-family="Arial, sans-serif" font-size="10" fill="#666">Email • SSN • Phone • Names</text>
<!-- Magnifying Glass -->
<circle cx="104" cy="85" r="30" stroke="#FF6B35" stroke-width="3" fill="none"/>
<line x1="126" y1="107" x2="145" y2="126" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
