<circle cx="50" cy="110" r="3" fill="#FF6B35" opacity="0.5"/>
<circle cx="70" cy="115" r="3" fill="#FF6B35" opacity="0.5"/>
<circle cx="90" cy="108" r="3" fill="#FF6B35" opacity="0.5"/>
<circle cx="140" cy="65" r="3" fill="#FF6B35" opacity="0.5"/>
